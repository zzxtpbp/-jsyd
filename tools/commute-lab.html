<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吉时 · 通勤计算验收台</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#131c1c;color:#edf5ed}*{box-sizing:border-box}body{margin:0;padding:28px 20px;max-width:1100px;margin-inline:auto}h1{font-size:clamp(26px,5vw,40px);margin:14px 0}h2{font-size:20px}p{line-height:1.7;color:#b9cbc4}.badge{background:#463b20;color:#ffe3a0;border:1px solid #76613b;padding:14px;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-block:20px}.panel{background:#1c2927;border:1px solid #395148;border-radius:18px;padding:22px;min-width:0}label{display:block;margin:16px 0;color:#cfdfd6}input,select,button{font:inherit;border:1px solid #688479;border-radius:9px;background:#14211c;color:#edf5ed;padding:10px;max-width:100%}input[type=number],input[type=time],select{width:100%;margin-top:7px}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}button{cursor:pointer}.values{display:grid;grid-template-columns:1fr 1fr;gap:12px}.values strong{font-size:28px;display:block;margin-top:8px}.value{background:#14201d;padding:16px;border-radius:12px}.result{border-left:4px solid #bedbb0;padding:12px;background:#263b32}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}li{margin-block:9px;line-height:1.6}a{color:#bedbb0}small{line-height:1.7;color:#b9cbc4}@media(max-width:680px){.grid{grid-template-columns:1fr}body{padding:20px 14px}.panel{padding:18px}}
</style>
<body><div class="badge">模拟验收工具 · 不读取真实天气、不保存闹钟、不执行响铃</div><h1>把“算出来”，变成看得懂。</h1><p>固定虚拟时钟：2026-11-04 04:00（北京时间）。基础闹钟 07:00，到达目标 08:00。这里调用真实计算模块，输入全部为测试数据。</p>
<label for="scenario">选择测试场景<select id="scenario"></select></label>
<div class="grid"><section class="panel"><h2>本次设置</h2><form id="controls">
<label><input id="fixedEnabled" type="checkbox"> 固定提前模式</label><label>固定提前 / 分钟<input id="fixedMinutes" type="number" min="0" max="240" required></label>
<label><input id="smartEnabled" type="checkbox"> 智能提前模式</label><label>智能提前上限 / 分钟<input id="maxAdvance" type="number" min="0" max="240" required></label>
<label>起床准备 / 分钟<input id="preparation" type="number" min="0" max="240" required></label><label>到达余量 / 分钟<input id="buffer" type="number" min="0" max="240" required></label><label>雨雪额外准备 / 分钟<input id="extra" type="number" min="0" max="240" required></label>
<label>复查时间<input id="recheck" type="time" required></label><label><input id="ambientEnabled" type="checkbox"> 检查铃前环境音时间</label><label>铃前环境音偏移 / 分钟<input id="ambientOffset" type="number" min="1" max="60" required></label>
<button type="reset">恢复当前场景</button></form></section>
<section class="panel" aria-live="polite"><h2>结果与诊断</h2><div class="values"><div class="value">基础闹钟<strong>07:00</strong></div><div class="value">最终建议 / 保留时间<strong id="wake">—</strong></div><div class="value">建议来源<strong id="mode">—</strong></div><div class="value">剩余时间缺口<strong id="gap">—</strong></div></div><p class="result" id="message"></p><p id="operation"></p><ul id="issues"></ul><small>创建/更新仅为操作建议。已有记录不代表设备已同步。固定模式不受智能上限限制；没有路线时不会宣称通勤时间足够。环境音仅检查时间关系，本页不播放声音。</small><h2>本次事件顺序</h2><ul id="timeline"></ul><details><summary>查看结构化结果</summary><pre id="json"></pre></details></section></div>
<script type="module" src="./commute-lab.js"></script></body></html>
